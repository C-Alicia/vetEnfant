version: '3.8'

services:
  php:
    build: .
    container_name: symfony-php
    volumes:
      - .:/var/www/html
    depends_on:
      - database
    ports:
      - "8001:80"  # Optionnel : exposez Apache sur le port 8001 de l'hôte

  nginx:
    image: nginx:latest
    container_name: symfony-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: symfony-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: database
      MYSQL_ROOT_PASSWORD: Anljman@bddSql25!
    depends_on:
      - database

  database:
    image: mariadb:10.4
    container_name: symfony-db
    restart: always
    environment:
      MYSQL_USER: AerixT
      MYSQL_ROOT_PASSWORD: Anljman@bddSql25!
      MYSQL_PASSWORD: Anljman@bddSql25!
      MYSQL_DATABASE: vetenfant
    ports:
      - "3307:3306"  # Exposez le port 3307 de l'hôte vers le port 3306 du conteneur
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - my_network  # Utilisation du réseau personnalisé

networks:
  my_network:
    driver: bridge  # Le réseau Docker personnalisé pour les communications entre conteneurs

volumes:
  db-data:  # Volume pour persister les données de la base de données
