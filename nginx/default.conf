server {
    listen 80;  # Le serveur écoute les requêtes HTTP sur le port 80 (le port standard pour HTTP)
    server_name localhost;  # Définit le nom du serveur, ici il est configuré pour répondre à 'localhost'
    root /var/www/html/public;  # Le répertoire racine du site web, où se trouvent les fichiers publics (index.php, etc.)

    index index.php index.html index.htm;  # Les fichiers d'index que Nginx essaiera de servir, en priorité : index.php > index.html > index.htm

    location / {
        try_files $uri /index.php$is_args$args;  # Si la requête correspond à un fichier, il est servi. Sinon, elle est redirigée vers index.php
    }

    # Configuration pour traiter les requêtes PHP
    location ~ \.php$ { 
        proxy_pass http://php;  # Redirige la requête PHP vers un autre conteneur ou service nommé 'php' (ex. un serveur PHP-FPM)
        
        # Définir les en-têtes HTTP pour passer les informations relatives à la requête d'origine
        proxy_set_header Host $host;  # Passe l'en-tête "Host" (nom du serveur) à l'application PHP
        proxy_set_header X-Real-IP $remote_addr;  # Passe l'adresse IP réelle du client
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Passe l'adresse IP originale du client via un proxy
        proxy_set_header X-Forwarded-Proto $scheme;  # Passe le schéma utilisé pour la requête, soit 'http' ou 'https'
    }

    # Chemins des fichiers logs de Nginx pour suivre les erreurs et les accès
    error_log /var/log/nginx/error.log;  # Fichier de log des erreurs du serveur
    access_log /var/log/nginx/access.l
}